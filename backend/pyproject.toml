[project]
name = "fvi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "asyncpg==0.29.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "httpx==0.27.2",
  "asyncssh==2.17.0",
  "python-multipart==0.0.9",
  "python-jose[cryptography]==3.3.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3","pytest-asyncio==0.24.0","playwright==1.47.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"